name: Frontend CI and Staging Deploy

on:
  push:
    branches: [staging]
    paths:
      - '**'
  pull_request:
    branches: [staging]
    paths:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-build:
    name: Build PR (staging merge)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (staging config)
        run: npm run build:test

  deploy-frontend:
    name: Deploy on push to staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/workwise/frontend
            git fetch origin
            git pull origin staging
            npm i --no-audit --no-fund
            npm run build:test
            pm2 restart workwise-frontend
