name: Deploy Frontend (staging)

on:
  push:
    branches: [staging]
    paths:
      - '**'
  pull_request:
    branches: [staging]
    paths:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for PR context only)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKWISE_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/workwise/frontend
            git fetch origin
            git pull origin staging
            npm i --no-audit --no-fund
            npm run build:test
            pm2 restart workwise-frontend
