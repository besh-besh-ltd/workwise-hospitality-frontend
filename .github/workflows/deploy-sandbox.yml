name: Demo Deploy (sandbox)

# The Bindra demo (NEXT_PUBLIC_DEMO_MODE=1: fixture data, no backend, no DB)
# lives on this branch only and deploys to its own EC2, hospitality-sandbox.
# It never touches staging or production.

on:
  push:
    branches:
      - demo/sandbox
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Specific commit SHA to deploy (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-demo-sandbox
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.DEMO_ECR_REPOSITORY }}
  DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}

jobs:
  build-and-push:
    name: Build Docker image & push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}"

          # Only the demo knobs: every API call is served by lib/mockApi, and
          # PostHog / OTEL / push stay off because their vars are unset.
          docker build \
            --build-arg NEXT_PUBLIC_DEMO_MODE="1" \
            --build-arg NEXT_PUBLIC_ENV="sandbox" \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

  deploy:
    name: Deploy to sandbox EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    steps:
      - name: Write env file
        uses: appleboy/ssh-action@v1.0.3
        env:
          SESSION_SECRET: ${{ secrets.DEMO_SESSION_SECRET }}
        with:
          host: ${{ secrets.SANDBOX_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          envs: SESSION_SECRET
          script: |
            umask 077
            printf 'HOSTNAME=0.0.0.0\nSESSION_SECRET=%s\n' "$SESSION_SECRET" > "$HOME/.env.sandbox-demo"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.DEMO_ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.SANDBOX_SSH_HOST }}
          username: ${{ secrets.WORKWISE_SSH_USER }}
          key: ${{ secrets.WORKWISE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: IMAGE_URI
          script: |
            set -euo pipefail

            # ECR login (instance role, no keys on the box)
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # Pull and deploy
            docker pull "${IMAGE_URI}"
            bash "$HOME/deploy.sh" "${IMAGE_URI}"

            # Smoke: a persona can sign in and the signed session cookie verifies
            JAR=$(mktemp)
            curl -sf -c "$JAR" -H 'Content-Type: application/json' \
              -d '{"personaId":"purchase"}' http://127.0.0.1/api/auth/login >/dev/null
            curl -sf -b "$JAR" http://127.0.0.1/api/auth/me >/dev/null
            rm -f "$JAR"
            echo "Smoke OK: demo sign-in works"
